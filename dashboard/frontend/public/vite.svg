<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Outer ring representing the proof system -->
  <circle cx="50" cy="50" r="45" stroke="url(#grad1)" stroke-width="3" fill="none" opacity="0.3"/>
  <!-- Inner shield shape for "zero-knowledge" -->
  <path d="M50 10 L85 30 L85 60 L50 90 L15 60 L15 30 Z" stroke="url(#grad1)" stroke-width="2" fill="url(#grad1)" fill-opacity="0.2"/>
  <!-- ZK letters -->
  <text x="50" y="58" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="24" font-weight="700" fill="#6366f1">ZK</text>
  <!-- FL below -->
  <text x="50" y="74" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" font-weight="500" fill="#8b5cf6">FL</text>
</svg>
