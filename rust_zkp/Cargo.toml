[package]
name = "zkp-bindings"
version = "0.1.0"
edition = "2021"

[lib]
name = "zkp_bindings"
crate-type = ["cdylib"]

[dependencies]
# PyO3 for Python bindings - updated for Python 3.13 support
pyo3 = { version = "0.22", features = ["extension-module"] }

# PLONK implementation
halo2_proofs = "0.3"
halo2_gadgets = "0.3"
halo2curves = "0.9"
ff = "0.13"
group = "0.13"

# Bulletproofs
bulletproofs = "4.0"
curve25519-dalek-ng = "4.0"  # Use ng version for compatibility
merlin = "3.0"

# Nova - folding schemes
nova-snark = { git = "https://github.com/microsoft/Nova" }

# Arkworks for general SNARK components
ark-std = "0.4"
ark-ff = "0.4"
ark-ec = "0.4"
ark-serialize = "0.4"
ark-bn254 = "0.4"
ark-groth16 = "0.4"
ark-relations = "0.4"

# Utilities
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[build-dependencies]
pyo3-build-config = "0.22"
