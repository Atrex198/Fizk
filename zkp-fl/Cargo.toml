[workspace]
members = [
    "zkp-core",
    "mlp-circuit",
]
resolver = "2"

[workspace.dependencies]
# Core arkworks dependencies
ark-ff = "0.5"
ark-ec = "0.5"
ark-poly = "0.5"
ark-std = { version = "0.5", features = ["std"] }
ark-serialize = "0.5"
ark-relations = "0.5"
ark-r1cs-std = "0.5"
ark-bn254 = "0.5"
ark-grumpkin = "0.5"
ark-groth16 = "0.5"  # Added for real proof generation
ark-snark = "0.5"    # Added for SNARK trait

# Polynomial commitment schemes
ark-poly-commit = "0.5"
ark-crypto-primitives = "0.5"

# Utility crates
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
anyhow = "1.0"
blake3 = "1.0"
hex = "0.4"
rayon = "1.7"
rand = "0.8"

# Testing
criterion = "0.5"
proptest = "1.0"

# Benchmarking and profiling
tracing = "0.1"
tracing-subscriber = "0.3"

# Additional math utilities
num-bigint = "0.4"
num-traits = "0.2"
nalgebra = "0.32"

# Main binary dependencies
clap = { version = "4.0", features = ["derive"] }
tokio = { version = "1.0", features = ["full"] }

[package]
name = "zkp-fl"
version = "0.1.0"
edition = "2021"

[dependencies]
zkp-core = { path = "zkp-core" }
mlp-circuit = { path = "mlp-circuit" }
ark-ff = { workspace = true }
ark-ec = { workspace = true }
ark-bn254 = { workspace = true }
ark-grumpkin = { workspace = true }
ark-groth16 = { workspace = true }
ark-snark = { workspace = true }
ark-std = { workspace = true }
ark-relations = { workspace = true }
ark-r1cs-std = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
blake3 = { workspace = true }
hex = { workspace = true }
md5 = "0.7"

[[bin]]
name = "zkp-fl"
