<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZK-FL Configuration Portal - Standalone Demo</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container { 
            max-width: 1400px; 
            margin: 0 auto; 
            background: rgba(255,255,255,0.95);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            border-radius: 10px;
            color: white;
        }
        .header h1 { font-size: 2.5em; margin-bottom: 10px; }
        .header p { font-size: 1.2em; opacity: 0.9; }
        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .btn-primary { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }
        .btn-success { background: linear-gradient(135deg, #56ab2f 0%, #a8e6cf 100%); color: white; }
        .btn-warning { background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); color: white; }
        .btn-info { background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); color: white; }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        .config-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
        }
        .config-category {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .category-title {
            font-size: 1.3em;
            font-weight: bold;
            margin-bottom: 15px;
            color: #333;
            border-bottom: 2px solid #667eea;
            padding-bottom: 5px;
        }
        .param-group {
            margin-bottom: 15px;
        }
        .param-label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
            color: #555;
        }
        .param-input {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }
        .param-input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 5px rgba(102, 126, 234, 0.3);
        }
        .param-description {
            font-size: 12px;
            color: #666;
            margin-top: 3px;
        }
        .status-message {
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            display: none;
        }
        .status-success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .status-error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .status-info { background: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }
        .validation-panel {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            display: none;
            border: 1px solid #dee2e6;
        }
        .validation-panel.show { display: block; }
        .validation-item {
            display: flex;
            align-items: center;
            margin: 8px 0;
            padding: 5px;
        }
        .validation-icon {
            margin-right: 10px;
            font-weight: bold;
            font-size: 16px;
        }
        .valid { color: #28a745; }
        .invalid { color: #dc3545; }
        .warning { color: #ffc107; }
        .dashboard-info {
            background: #e7f3ff;
            border: 1px solid #b6d7ff;
            border-radius: 8px;
            padding: 15px;
            margin: 20px 0;
            text-align: center;
        }
        @media (max-width: 768px) {
            .config-grid { grid-template-columns: 1fr; }
            .controls { flex-direction: column; align-items: center; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>⚙️ ZK-FL Configuration Portal</h1>
            <p>Interactive Parameter Tweaking Interface</p>
        </div>
        
        <div class="controls">
            <button class="btn btn-success" onclick="saveConfiguration()">💾 Save Configuration</button>
            <button class="btn btn-warning" onclick="resetConfiguration()">🔄 Reset to Defaults</button>
            <button class="btn btn-info" onclick="exportConfiguration()">📤 Export Config</button>
            <button class="btn btn-primary" onclick="validateConfiguration()">✅ Validate</button>
            <button class="btn btn-primary" onclick="openDashboard()">📊 Open Dashboard</button>
        </div>
        
        <div id="statusMessage" class="status-message"></div>
        
        <div class="dashboard-info">
            <h4>📊 Dashboard Integration</h4>
            <p>Start the production dashboard separately with: <code>python3 production_dashboard.py</code></p>
            <p>Then use the "Open Dashboard" button to view real-time monitoring</p>
        </div>
        
        <form id="configForm">
            <div class="config-grid" id="configGrid">
                <!-- Configuration will be loaded here -->
            </div>
        </form>
        
        <div id="validationPanel" class="validation-panel">
            <h4>🔍 Configuration Validation Results</h4>
            <div id="validationResults"></div>
        </div>
    </div>
    
    <script>
        // Default configuration
        const defaultConfig = {
            num_clients: 10,
            num_rounds: 20,
            client_fraction: 0.8,
            local_epochs: 5,
            learning_rate: 0.001,
            batch_size: 32,
            input_size: 13,
            hidden_sizes: [64, 32, 16],
            dropout_rate: 0.3,
            activation_function: "ReLU",
            constraint_reduction_factor: 0.4,
            parallel_workers: 4,
            memory_optimization: true,
            batch_processing_size: 8,
            proof_compression: true,
            alpha: 0.5,
            feature_skew_factor: 0.3,
            quantity_imbalance_ratio: 0.7,
            min_samples_per_client: 50,
            aggregation_threshold: 3,
            verification_timeout: 30.0,
            proof_batch_size: 5,
            parallel_verification: true,
            websocket_timeout: 60.0,
            metrics_retention_size: 1000,
            update_frequency_ms: 2000,
            max_concurrent_connections: 100,
            zkp_security_level: 128,
            proof_verification_strictness: "high",
            client_authentication: true,
            encrypted_communication: true,
            chart_update_interval: 5,
            real_time_monitoring: true,
            static_report_generation: true,
            mobile_responsive: true
        };
        
        // Parameter categories
        const categories = {
            "Federated Learning": ["num_clients", "num_rounds", "client_fraction", "local_epochs", "learning_rate", "batch_size"],
            "Model Architecture": ["input_size", "hidden_sizes", "dropout_rate", "activation_function"],
            "ZKP Circuit": ["constraint_reduction_factor", "parallel_workers", "memory_optimization", "batch_processing_size", "proof_compression"],
            "Non-IID Data": ["alpha", "feature_skew_factor", "quantity_imbalance_ratio", "min_samples_per_client"],
            "Protogalaxy": ["aggregation_threshold", "verification_timeout", "proof_batch_size", "parallel_verification"],
            "Performance": ["websocket_timeout", "metrics_retention_size", "update_frequency_ms", "max_concurrent_connections"],
            "Security": ["zkp_security_level", "proof_verification_strictness", "client_authentication", "encrypted_communication"],
            "Dashboard": ["chart_update_interval", "real_time_monitoring", "static_report_generation", "mobile_responsive"]
        };
        
        // Parameter descriptions
        const paramDescriptions = {
            'num_clients': 'Number of federated learning clients (hospitals)',
            'num_rounds': 'Total training rounds for federated learning',
            'client_fraction': 'Fraction of clients participating per round (0.0-1.0)',
            'local_epochs': 'Local training epochs per client',
            'learning_rate': 'Learning rate for model training',
            'batch_size': 'Batch size for training',
            'input_size': 'Input dimension for the model',
            'hidden_sizes': 'Hidden layer sizes (comma-separated)',
            'dropout_rate': 'Dropout rate for regularization (0.0-1.0)',
            'activation_function': 'Activation function (ReLU, Tanh, Sigmoid)',
            'constraint_reduction_factor': 'ZKP constraint reduction factor (0.0-1.0)',
            'parallel_workers': 'Number of parallel workers for proof generation',
            'memory_optimization': 'Enable memory optimization',
            'batch_processing_size': 'Batch size for proof processing',
            'proof_compression': 'Enable proof compression',
            'alpha': 'Dirichlet concentration parameter for non-IID data',
            'feature_skew_factor': 'Feature distribution skew factor',
            'quantity_imbalance_ratio': 'Data quantity imbalance ratio',
            'min_samples_per_client': 'Minimum samples per client',
            'aggregation_threshold': 'Minimum proofs for aggregation',
            'verification_timeout': 'Proof verification timeout (seconds)',
            'proof_batch_size': 'Batch size for proof aggregation',
            'parallel_verification': 'Enable parallel proof verification',
            'websocket_timeout': 'WebSocket connection timeout',
            'metrics_retention_size': 'Number of metrics to retain',
            'update_frequency_ms': 'Dashboard update frequency (milliseconds)',
            'max_concurrent_connections': 'Maximum concurrent connections',
            'zkp_security_level': 'ZKP security level in bits',
            'proof_verification_strictness': 'Verification strictness (low, medium, high)',
            'client_authentication': 'Enable client authentication',
            'encrypted_communication': 'Enable encrypted communication',
            'chart_update_interval': 'Chart update interval (seconds)',
            'real_time_monitoring': 'Enable real-time monitoring',
            'static_report_generation': 'Enable static report generation',
            'mobile_responsive': 'Enable mobile responsive design'
        };
        
        let currentConfig = {...defaultConfig};
        
        function loadConfiguration() {
            // Load from localStorage if available
            const saved = localStorage.getItem('zkfl_config');
            if (saved) {
                try {
                    currentConfig = {...defaultConfig, ...JSON.parse(saved)};
                } catch (e) {
                    console.error('Error loading saved config:', e);
                }
            }
            
            renderConfigurationForm(currentConfig, categories);
        }
        
        function renderConfigurationForm(config, categories) {
            const grid = document.getElementById('configGrid');
            grid.innerHTML = '';
            
            for (const [categoryName, paramNames] of Object.entries(categories)) {
                const categoryDiv = document.createElement('div');
                categoryDiv.className = 'config-category';
                
                const title = document.createElement('div');
                title.className = 'category-title';
                title.textContent = categoryName;
                categoryDiv.appendChild(title);
                
                paramNames.forEach(paramName => {
                    const paramDiv = document.createElement('div');
                    paramDiv.className = 'param-group';
                    
                    const label = document.createElement('label');
                    label.className = 'param-label';
                    label.textContent = paramName.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
                    
                    const input = document.createElement('input');
                    input.className = 'param-input';
                    input.name = paramName;
                    input.id = paramName;
                    
                    const value = config[paramName];
                    if (typeof value === 'boolean') {
                        input.type = 'checkbox';
                        input.checked = value;
                    } else if (Array.isArray(value)) {
                        input.type = 'text';
                        input.value = value.join(', ');
                    } else {
                        input.type = typeof value === 'number' ? 'number' : 'text';
                        input.value = value;
                        if (typeof value === 'number') {
                            input.step = value % 1 === 0 ? '1' : '0.001';
                        }
                    }
                    
                    // Add change listener to update config
                    input.addEventListener('change', () => updateConfigValue(paramName, input));
                    
                    const description = document.createElement('div');
                    description.className = 'param-description';
                    description.textContent = paramDescriptions[paramName] || '';
                    
                    paramDiv.appendChild(label);
                    paramDiv.appendChild(input);
                    paramDiv.appendChild(description);
                    categoryDiv.appendChild(paramDiv);
                });
                
                grid.appendChild(categoryDiv);
            }
        }
        
        function updateConfigValue(paramName, input) {
            let value;
            if (input.type === 'checkbox') {
                value = input.checked;
            } else if (input.type === 'number') {
                value = parseFloat(input.value);
            } else if (paramName === 'hidden_sizes') {
                value = input.value.split(',').map(x => parseInt(x.trim())).filter(x => !isNaN(x));
            } else {
                value = input.value;
            }
            
            currentConfig[paramName] = value;
        }
        
        function saveConfiguration() {
            // Save to localStorage
            localStorage.setItem('zkfl_config', JSON.stringify(currentConfig));
            
            // Also save to file (download)
            const dataStr = JSON.stringify(currentConfig, null, 2);
            const dataBlob = new Blob([dataStr], {type: 'application/json'});
            const url = URL.createObjectURL(dataBlob);
            const link = document.createElement('a');
            link.href = url;
            link.download = 'zkfl_config.json';
            link.click();
            URL.revokeObjectURL(url);
            
            showStatus('Configuration saved successfully! Downloaded as zkfl_config.json', 'success');
        }
        
        function resetConfiguration() {
            if (confirm('Are you sure you want to reset all parameters to defaults?')) {
                currentConfig = {...defaultConfig};
                localStorage.removeItem('zkfl_config');
                loadConfiguration();
                showStatus('Configuration reset to defaults', 'info');
            }
        }
        
        function exportConfiguration() {
            const dataStr = JSON.stringify(currentConfig, null, 2);
            const dataBlob = new Blob([dataStr], {type: 'application/json'});
            const url = URL.createObjectURL(dataBlob);
            const link = document.createElement('a');
            link.href = url;
            link.download = 'zkfl_config_export.json';
            link.click();
            URL.revokeObjectURL(url);
            showStatus('Configuration exported successfully', 'success');
        }
        
        function validateConfiguration() {
            const validation = performValidation(currentConfig);
            displayValidationResults(validation);
            showStatus(`Validation complete: ${validation.filter(v => v.status === 'valid').length} valid, ${validation.filter(v => v.status === 'warning').length} warnings, ${validation.filter(v => v.status === 'invalid').length} errors`, 'info');
        }
        
        function performValidation(config) {
            const results = [];
            
            // Federated Learning validation
            if (config.num_clients < 2) {
                results.push({status: "invalid", message: "Number of clients must be at least 2"});
            } else if (config.num_clients > 100) {
                results.push({status: "warning", message: "Large number of clients may impact performance"});
            } else {
                results.push({status: "valid", message: `Client count (${config.num_clients}) is optimal`});
            }
            
            if (config.client_fraction < 0.1 || config.client_fraction > 1.0) {
                results.push({status: "invalid", message: "Client fraction must be between 0.1 and 1.0"});
            } else {
                results.push({status: "valid", message: "Client fraction is valid"});
            }
            
            if (config.learning_rate <= 0 || config.learning_rate > 1) {
                results.push({status: "warning", message: "Learning rate seems unusual (should be 0.0001-0.1)"});
            } else {
                results.push({status: "valid", message: "Learning rate is reasonable"});
            }
            
            // Model Architecture validation
            if (config.dropout_rate < 0 || config.dropout_rate >= 1) {
                results.push({status: "invalid", message: "Dropout rate must be between 0.0 and 1.0"});
            } else {
                results.push({status: "valid", message: "Dropout rate is appropriate"});
            }
            
            // ZKP Circuit validation
            if (config.constraint_reduction_factor < 0.1 || config.constraint_reduction_factor > 0.8) {
                results.push({status: "warning", message: "Constraint reduction factor may be suboptimal"});
            } else {
                results.push({status: "valid", message: "Constraint reduction is well-tuned"});
            }
            
            if (config.parallel_workers < 1 || config.parallel_workers > 16) {
                results.push({status: "warning", message: "Parallel workers count may not be optimal"});
            } else {
                results.push({status: "valid", message: "Parallel workers count is appropriate"});
            }
            
            // Non-IID validation
            if (config.alpha <= 0) {
                results.push({status: "invalid", message: "Dirichlet alpha must be positive"});
            } else if (config.alpha < 0.1) {
                results.push({status: "warning", message: "Very low alpha creates extreme non-IID data"});
            } else {
                results.push({status: "valid", message: "Dirichlet alpha is appropriate"});
            }
            
            // Security validation
            if (config.zkp_security_level < 80) {
                results.push({status: "invalid", message: "Security level too low for production"});
            } else if (config.zkp_security_level > 256) {
                results.push({status: "warning", message: "Very high security level may impact performance"});
            } else {
                results.push({status: "valid", message: "Security level is appropriate"});
            }
            
            // Performance validation
            if (config.batch_size < 1 || config.batch_size > 1024) {
                results.push({status: "warning", message: "Batch size may be suboptimal"});
            } else {
                results.push({status: "valid", message: "Batch size is reasonable"});
            }
            
            return results;
        }
        
        function displayValidationResults(validation) {
            const panel = document.getElementById('validationPanel');
            const results = document.getElementById('validationResults');
            
            results.innerHTML = '';
            validation.forEach(item => {
                const div = document.createElement('div');
                div.className = 'validation-item';
                
                const icon = document.createElement('span');
                icon.className = 'validation-icon ' + item.status;
                icon.textContent = item.status === 'valid' ? '✅' : 
                                 item.status === 'invalid' ? '❌' : '⚠️';
                
                const text = document.createElement('span');
                text.textContent = item.message;
                
                div.appendChild(icon);
                div.appendChild(text);
                results.appendChild(div);
            });
            
            panel.classList.add('show');
        }
        
        function openDashboard() {
            // Try to open the dashboard
            const dashboardUrl = 'http://localhost:8080';
            const newWindow = window.open(dashboardUrl, '_blank');
            
            if (!newWindow) {
                showStatus('Dashboard not running. Start it with: python3 production_dashboard.py', 'error');
            } else {
                // Check if dashboard is actually running
                setTimeout(() => {
                    if (newWindow.closed) {
                        showStatus('Dashboard opened successfully', 'success');
                    }
                }, 1000);
            }
        }
        
        function showStatus(message, type) {
            const statusDiv = document.getElementById('statusMessage');
            statusDiv.textContent = message;
            statusDiv.className = 'status-message status-' + type;
            statusDiv.style.display = 'block';
            setTimeout(() => {
                statusDiv.style.display = 'none';
            }, 5000);
        }
        
        // Load configuration on page load
        document.addEventListener('DOMContentLoaded', loadConfiguration);
    </script>
</body>
</html>
